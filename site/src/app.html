<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Louize Italic is loaded from the start: otherwise the browser waits
         for the first italic word on the screen (a note opening, a caption)
         and that text is drawn in another font, then reflows -->
    <link rel="preload" href="/fonts/205TF-Louize-Italic.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
